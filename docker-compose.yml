version: "3.9"

services:

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.1.2
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      POST: 1
      DELETE: 1
      SERVICES: 0
      TASKS: 0
      VOLUMES: 0
      INFO: 1
      VERSION: 1
      PING: 1
      IMAGES: 1
      BUILD: 0
      EXEC: 0
      SWARM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket_proxy
    restart: unless-stopped

  traefik:
    image: traefik:v3.1
    depends_on:
      - docker-socket-proxy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cloudflare_token
      - TRAEFIK_CERTIFICATESRESOLVERS_CLOUDFLARE_ACME_EMAIL=${ACME_EMAIL}
    secrets:
      - cloudflare_token
    volumes:
      - ./traefik/config/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/conf.d:/etc/traefik/conf.d:rw
      - traefik_acme:/etc/traefik/acme
      - traefik_logs:/var/log/traefik
    networks:
      - traefik_public
      - socket_proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${BASE_DOMAIN}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls.certresolver=cloudflare"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth@docker"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=provisioning
      - POSTGRES_PASSWORD=provisioning
      - POSTGRES_DB=provisioning
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - provisioning_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provisioning"]
      interval: 10s
      timeout: 5s
      retries: 5

  provisioning-api:
    build: ./services/provisioning-api
    environment:
      - DATABASE_URL=postgresql+asyncpg://provisioning:provisioning@postgres:5432/provisioning
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - CF_API_TOKEN_FILE=/run/secrets/cloudflare_token
      - BASE_DOMAIN=${BASE_DOMAIN}
      - VM_IP=${VM_IP}
      - CF_ZONE_ID=${CF_ZONE_ID}
      - TRAEFIK_CONF_DIR=/traefik/conf.d
      - TRAEFIK_RESTART_ON_CONFIG_CHANGE=${TRAEFIK_RESTART_ON_CONFIG_CHANGE:-false}
      - MOCK_CLOUDFLARE=${MOCK_CLOUDFLARE:-false}
      - PREVIEW_USE_SIDECAR=${PREVIEW_USE_SIDECAR:-false}
    secrets:
      - cloudflare_token
    volumes:
      - ./traefik/conf.d:/traefik/conf.d:rw
    networks:
      - traefik_public
      - socket_proxy
      - provisioning_internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.provisioning.rule=Host(`api.${BASE_DOMAIN}`)"
      - "traefik.http.routers.provisioning.entrypoints=websecure"
      - "traefik.http.routers.provisioning.tls.certresolver=cloudflare"
      - "traefik.http.services.provisioning.loadbalancer.server.port=8000"
      - "traefik.docker.network=traefik_public"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  socket_proxy:
    internal: true
  traefik_public:
    name: traefik_public
    driver: bridge
  gtm_internal:
    name: gtm_internal
    driver: bridge
    internal: true
  provisioning_internal:
    internal: true

volumes:
  traefik_acme:
  traefik_logs:
  postgres_data:

secrets:
  cloudflare_token:
    file: ./secrets/cloudflare_token.txt
